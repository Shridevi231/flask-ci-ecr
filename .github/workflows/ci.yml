name: CI & Build → ECR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo (debug)
        run: |
          echo "RUNNER WORKDIR: $GITHUB_WORKSPACE"
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # ensure we are in repo root
          pwd
          ls -la
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pwd
          echo "PYTHONPATH=$PYTHONPATH"
          pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          # build from repo root (where Dockerfile lives)
          docker build -t flask-ci-ecr:latest .

      - name: Tag & push image to ECR
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME=${{ secrets.ECR_REPOSITORY }}
          TAG=${{ github.sha }}
          docker tag flask-ci-ecr:latest ${REGISTRY}/${IMAGE_NAME}:${TAG}
          docker push ${REGISTRY}/${IMAGE_NAME}:${TAG}
